name: Deploy Pages with smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_override:
        description: "Leave empty. Set a fake value to force a smoke-test failure."
        required: false
        default: ""
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write version
        run: echo "${GITHUB_SHA}" > version.txt
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check live version
        env:
          EXPECTED: ${{ github.event.inputs.expected_override || github.sha }}
        run: |
          URL="https://hank0903.github.io/devops-pages-lab/version.txt"
          for i in 1 2 3 4 5 6; do
            LIVE=$(curl -fsS "$URL?cb=$RANDOM" | tr -d '[:space:]' || true)
            echo "attempt $i: live=$LIVE expected=$EXPECTED"
            if [ "$LIVE" = "$EXPECTED" ]; then echo "Smoke test passed"; exit 0; fi
            sleep 10
          done
          echo "Smoke test FAILED: live version does not match"
          exit 1